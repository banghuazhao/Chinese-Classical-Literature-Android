plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def externalKeystoreProperties = System.getenv('RELEASE_KEYSTORE_PROPERTIES')
def keystorePropertiesFile = externalKeystoreProperties
        ? file(externalKeystoreProperties)
        : rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def releaseAdValue = { String key ->
    localProperties.getProperty(key, "MISSING_${key}").trim()
}

def validateReleaseInputs = {
    def issues = []
    def adIds = [
            AdMobAppId: 'ca-app-pub-\\d{16}~\\d{10}',
            adBannerID: 'ca-app-pub-\\d{16}/\\d{10}',
            adInterstitialID: 'ca-app-pub-\\d{16}/\\d{10}',
            adAppOpenID: 'ca-app-pub-\\d{16}/\\d{10}',
            adRewardedID: 'ca-app-pub-\\d{16}/\\d{10}'
    ]
    adIds.each { key, pattern ->
        def value = localProperties.getProperty(key)?.trim()
        if (!value || !value.matches(pattern) || value.contains('3940256099942544')) {
            issues << "${key} must be a production AdMob ID in local.properties"
        }
    }
    if (!hasKeystore) {
        issues << 'keystore.properties is missing (or set RELEASE_KEYSTORE_PROPERTIES)'
    } else {
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
            if (!keystoreProperties.getProperty(key)?.trim()) {
                issues << "keystore.properties is missing ${key}"
            }
        }
        def storeFilePath = keystoreProperties.getProperty('storeFile')
        if (storeFilePath && !file(storeFilePath).isFile()) {
            issues << 'keystore.properties storeFile does not exist'
        }
    }
    if (!issues.isEmpty()) {
        throw new GradleException('Release inputs invalid: ' + issues.join('; '))
    }
}

android {
    namespace = 'com.appsbay.chineseclassicalliteratural'
    compileSdk = 37

    defaultConfig {
        applicationId "com.appsbay.chineseclassicalliteratural"
        minSdk = 23
        targetSdk = 37
        versionCode = 13
        versionName = "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "int", "CONSENT_DEBUG_GEOGRAPHY", "0"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) signingConfig = signingConfigs.release
            manifestPlaceholders = [AdMobAppId: releaseAdValue('AdMobAppId')]
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'


            resValue "string", "adBannerID", releaseAdValue('adBannerID')
            resValue "string", "adInterstitialID", releaseAdValue('adInterstitialID')
            resValue "string", "adAppOpenID", releaseAdValue('adAppOpenID')
            resValue "string", "adRewardedID", releaseAdValue('adRewardedID')
        }

        debug {
            buildConfigField "int", "CONSENT_DEBUG_GEOGRAPHY", "0"
            manifestPlaceholders = [AdMobAppId: 'ca-app-pub-3940256099942544~3347511713']
            resValue "string", "adBannerID", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "adInterstitialID", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "adAppOpenID", "ca-app-pub-3940256099942544/3419835294"
            resValue "string", "adRewardedID", "ca-app-pub-3940256099942544/5224354917"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        resValues = true
    }
    lint {
        // Reported against Picasso's RemoteViews notification API, which this app never calls.
        disable 'NotificationPermission'
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        validateReleaseInputs()
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation project(':shinebuttonlib')
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    implementation 'com.android.billingclient:billing:9.1.0'

