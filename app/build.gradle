plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

afterEvaluate {
    def mapSources = tasks.findByName('mapDebugSourceSetPaths')
    def googleServices = tasks.findByName('processDebugGoogleServices')
    if (mapSources != null && googleServices != null) {
        mapSources.dependsOn googleServices
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def AdMobAppId = localProperties.getProperty('AdMobAppId')
if (AdMobAppId == null) {
    AdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
}

android {
    namespace 'com.appsbay.chineseclassicalliteratural'
    compileSdk 37

    defaultConfig {
        applicationId "com.appsbay.chineseclassicalliteratural"
        minSdk 23
        targetSdk 37
        versionCode 13
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [AdMobAppId: AdMobAppId]
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'


            resValue "string", "adBannerID", localProperties['adBannerID'] ?: ""
            resValue "string", "adInterstitialID", localProperties['adInterstitialID'] ?: ""
            resValue "string", "adAppOpenID", localProperties['adAppOpenID'] ?: ""
            resValue "string", "adNativeID", localProperties['adNativeID'] ?: ""
            resValue "string", "adRewardedID", localProperties['adRewardedID'] ?: ""
        }

        debug {
            resValue "string", "adBannerID", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "adInterstitialID", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "adNativeID", "ca-app-pub-3940256099942544/2247696110"
            resValue "string", "adAppOpenID", "ca-app-pub-3940256099942544/3419835294"
            resValue "string", "adRewardedID", "ca-app-pub-3940256099942544/5224354917"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    lint {
        // Reported against Picasso's RemoteViews notification API, which this app never calls.
        disable 'NotificationPermission'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation project(':shinebuttonlib')
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    implementation 'com.android.billingclient:billing:9.1.0'

    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'

    def lifecycle_version = "2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    implementation 'com.google.ads.mediation:facebook:6.22.0.0'
}
